# gofw 管理面板反代配置（置于 EdgeOne / CDN 之后，源站只暴露 443）
# 前置条件：
#   1) 源站防火墙(ipset: ysl_admin4)仅放行 EdgeOne 回源段 + 管理员 IP，80/443 不对公网全开
#   2) 证书由 EdgeOne 终结 TLS 时，源站可仅监听 80 由 EdgeOne 回源 HTTP；
#      若源站直连公网，则配置证书并监听 443

server {
    # 若 EdgeOne 已终结 TLS、回源为 HTTP：
    listen 80;
    # 若源站直连公网、需源站 TLS：
    # listen 443 ssl;
    # ssl_certificate     /opt/gofw/certs/fullchain.pem;
    # ssl_certificate_key /opt/gofw/certs/privkey.pem;

    server_name fw.example.com;   # 改成你的管理域名(走 EdgeOne)

    # 基础安全：隐藏版本、限制请求体
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
