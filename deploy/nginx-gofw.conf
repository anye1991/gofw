# gofw 管理面板反代配置
# 源站同时监听 80(HTTP) 与 443(HTTPS, 自签证书) 两个端口
#
# 推荐架构：EdgeOne 终结 TLS、回源 HTTP 到本机 :80（此时 443 块仅作「DNS 直连源站」的兜底）
# 若 DNS 直连源站(绕过 EdgeOne)，则使用 443 块，浏览器会提示自签证书、手动信任即可
#
# 自签证书生成（源站执行一次）：
#   mkdir -p /opt/gofw/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout /opt/gofw/certs/gofw.duduziy.com.privkey.pem \
#     -out    /opt/gofw/certs/gofw.duduziy.com.fullchain.pem \
#     -days 3650 -subj "/CN=gofw.duduziy.com" \
#     -addext "subjectAltName=DNS:gofw.duduziy.com"
#
# 如需由 Let's Encrypt / 宝塔签发正规证书，把下面 ssl_certificate 两行换成对应路径即可。

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name gofw.duduziy.com;   # 改成你的管理域名

    # 基础安全：隐藏版本、限制请求体
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /opt/gofw/certs/gofw.duduziy.com.fullchain.pem;
    ssl_certificate_key /opt/gofw/certs/gofw.duduziy.com.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
